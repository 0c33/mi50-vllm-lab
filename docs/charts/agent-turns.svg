<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 350' width='860' height='350' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='860' height='350' rx='14' fill='#ffffff'/><text x='28' y='40' font-size='20' font-weight='700' fill='#1f2937'>Agent turns: time to first token on a 16k-token conversation</text><text x='28' y='64' font-size='13' fill='#6b7280'>Each turn adds the previous reply + ~600 tokens of tool output. Before: cache hits per 1,584-token block</text><line x1='300.0' x2='300.0' y1='136' y2='284' stroke='#c3c2b7' stroke-width='1'/><text x='300.0' y='302' font-size='12' text-anchor='middle' fill='#898781'>0 s</text><line x1='422.5' x2='422.5' y1='136' y2='284' stroke='#e1e0d9' stroke-width='1'/><text x='422.5' y='302' font-size='12' text-anchor='middle' fill='#898781'>4 s</text><line x1='545.0' x2='545.0' y1='136' y2='284' stroke='#e1e0d9' stroke-width='1'/><text x='545.0' y='302' font-size='12' text-anchor='middle' fill='#898781'>8 s</text><line x1='667.5' x2='667.5' y1='136' y2='284' stroke='#e1e0d9' stroke-width='1'/><text x='667.5' y='302' font-size='12' text-anchor='middle' fill='#898781'>12 s</text><line x1='790.0' x2='790.0' y1='136' y2='284' stroke='#e1e0d9' stroke-width='1'/><text x='790.0' y='302' font-size='12' text-anchor='middle' fill='#898781'>16 s</text><text x='284' y='165' font-size='14' text-anchor='end' fill='#1f2937'>Turn 2</text><line x1='460.8' x2='670.3' y1='160' y2='160' stroke='#c3c2b7' stroke-width='2'/><circle cx='670.3' cy='160' r='6' fill='#898781' stroke='#ffffff' stroke-width='2'/><circle cx='460.8' cy='160' r='6' fill='#2a78d6' stroke='#ffffff' stroke-width='2'/><text x='682.3' y='165' font-size='13' fill='#52514e'>12.1 s</text><text x='448.8' y='165' font-size='13' font-weight='700' text-anchor='end' fill='#1f2937'>5.3 s</text><text x='284' y='213' font-size='14' text-anchor='end' fill='#1f2937'>Turn 3</text><line x1='435.7' x2='742.8' y1='208' y2='208' stroke='#c3c2b7' stroke-width='2'/><circle cx='742.8' cy='208' r='6' fill='#898781' stroke='#ffffff' stroke-width='2'/><circle cx='435.7' cy='208' r='6' fill='#2a78d6' stroke='#ffffff' stroke-width='2'/><text x='754.8' y='213' font-size='13' fill='#52514e'>14.5 s</text><text x='423.7' y='213' font-size='13' font-weight='700' text-anchor='end' fill='#1f2937'>4.4 s</text><text x='284' y='261' font-size='14' text-anchor='end' fill='#1f2937'>Same request again</text><line x1='343.5' x2='742.8' y1='256' y2='256' stroke='#c3c2b7' stroke-width='2'/><circle cx='742.8' cy='256' r='6' fill='#898781' stroke='#ffffff' stroke-width='2'/><circle cx='343.5' cy='256' r='6' fill='#2a78d6' stroke='#ffffff' stroke-width='2'/><text x='754.8' y='261' font-size='13' fill='#52514e'>14.5 s</text><text x='331.5' y='261' font-size='13' font-weight='700' text-anchor='end' fill='#1f2937'>1.4 s</text><line x1='28' x2='46' y1='102' y2='102' stroke='#898781' stroke-width='3' stroke-linecap='round'/><circle cx='37' cy='102' r='4' fill='#898781' stroke='#ffffff' stroke-width='2'/><text x='56' y='106' font-size='13' fill='#1f2937'>before: block-level prefix cache</text><line x1='322.8' x2='340.8' y1='102' y2='102' stroke='#2a78d6' stroke-width='3' stroke-linecap='round'/><circle cx='331.8' cy='102' r='4' fill='#2a78d6' stroke='#ffffff' stroke-width='2'/><text x='350.8' y='106' font-size='13' fill='#1f2937'>after: 16-token prefix matching</text></svg>